packages:
  - 'packages/*'
  - 'apps/*'
  - 'tooling/*'
  - 'registry'

# Skip optional peer-dep resolution. Dependencies like better-auth declare
# Next.js / SvelteKit / Solid / Vue as optional peers for their adapter
# packages; with autoInstallPeers on, pnpm pulls those into the lockfile
# (and node_modules/.pnpm) even though we never import them — bloating
# installs and surfacing CVEs in code that's never executed. We only use
# better-auth's React + Drizzle adapters, which are direct deps.
autoInstallPeers: false

# Security floors for transitive packages (moved from package.json "pnpm.overrides",
# which pnpm 12 no longer reads).
overrides:
  h3: '>=2.0.1-rc.19'
  h3-v2: 'npm:h3@>=2.0.1-rc.19'
  defu: '>=6.1.5'
  # Security floors (S1, 2026-10-25). Global only where every consumer is on
  # one major; scoped to the parent that needs it otherwise, so a floor can
  # never drag a different consumer across a major (jsdom wants undici 8).
  # Drop a line once every parent ships the fixed version on its own. A
  # scoped line covers only the parents it names: re-run `pnpm audit --prod`
  # after any astro bump, which can add a parent the selectors miss.
  dompurify: '^3.4.17' # sanitizer bypasses (monaco-editor, mermaid)
  vue: '^3.5.44' # @vue/server-renderer XSS (better-auth, vitepress)
  miniflare>undici: '^7.30.1' # DoS in miniflare's pinned 7.29.1 (test sessions, local dev)
  js-yaml: '^4.3.2' # quadratic CPU on crafted YAML
  fast-uri: '^3.1.9' # host confusion / SSRF in ajv's URI parsing
  postcss: '^8.5.31' # source-map path traversal
  source-map-js: '^1.2.2' # DoS on crafted source maps
  astro>devalue: '^5.9.4'
  astro>http-cache-semantics: '^4.3.0'
  astro>smol-toml: '^1.9.1'
  '@astrojs/markdown-remark>smol-toml': '^1.9.1'
  '@astrojs/internal-helpers>smol-toml': '^1.9.1'
  astro>svgo: '^4.1.0'
  astro>vite: '^7.3.7' # astro only — vitepress (vite 5) and apps/web (vite 8) untouched
  lodash-es: '>=4.18.1'
  next: '>=16.2.6'

# Native/binary postinstall scripts pnpm 12 blocks unless allowlisted.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

# Third-party packages that ship agent skills are never linked into this
# repo's .claude/skills — ours are hand-written.
permissions:
  '@tanstack/react-start':
    skills: false
