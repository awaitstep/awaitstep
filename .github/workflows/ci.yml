name: Tests

on:
  pull_request:
    # The full suite, db included, runs here only: local rounds run the tests their changes reach
    # (`pnpm test:affected`).
    branches: [main, dev, feat/awaitstep-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      ${{ !startsWith(github.head_ref, 'chore/registry-index-') &&
          !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate agent skills
        run: pnpm skills:check

      - name: Test root scripts
        run: pnpm test:scripts

      # `nodes/registry.json` is generated, not committed; the IR tests read it.
      - name: Build the node registry
        run: pnpm nodes:build

      - name: Test
        run: pnpm test

  # Auto-pass for registry index and release-please PRs
  test-skip:
    if: >-
      ${{ startsWith(github.head_ref, 'chore/registry-index-') ||
          startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping tests for auto-generated PR"

  # Single required status check — always reports regardless of which job ran
  ci:
    if: always()
    needs: [test, test-skip]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" == "failure" ]]; then
            exit 1
          fi
